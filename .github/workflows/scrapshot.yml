name: Scrapshot prototype
on:
  pull_request:
    paths:
      - 'experiments/scrapshot/**'
      - '.github/workflows/scrapshot.yml'
  push:
    branches: ['feat/scrapshot-prototype']
    paths:
      - 'experiments/scrapshot/**'
      - '.github/workflows/scrapshot.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/scrapshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: experiments/scrapshot/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: scrapshot-web
          path: experiments/scrapshot/dist/
          if-no-files-found: error
