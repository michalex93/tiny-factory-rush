name: XR Foundation Check

on:
  pull_request:
  push:
    branches:
      - feat/xr-foundation-v0

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: XR harness smoke fixture
        run: npm run xr:harness -- tools/xr-harness/examples/smoke-pass.json --strict
