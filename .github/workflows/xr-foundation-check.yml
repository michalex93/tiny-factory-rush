name: Quality gates

on:
  pull_request:
  push:
    branches:
      - master
      - 'feat/**'

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Full gates (diff anti-cheat runs inside the agent loop, not in CI)
        run: node scripts/gates.mjs --level full --no-diff
